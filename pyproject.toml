[project]
name = "raven"
version = "0.1.0"
description = "Personal AI assistant with local RAG and Firecrawl integration"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.5",
    "docx2txt>=0.9",
    "fastapi>=0.135.3",
    "firecrawl-py>=4.21.0",
    "langchain>=1.2.14",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.4",
    "langchain-text-splitters>=0.3",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "pypdf>=6.9.2",
    "python-dotenv>=1.2.2",
    "sse-starlette>=3.3.4",
    "structlog>=24.0.0",
    "tiktoken>=0.12.0",
    "uvicorn>=0.42.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
# Desktop shells (web-UI based). Install only the one you want:
#   uv sync --extra desktop-webview     # Option A — pywebview (lightest)
#   uv sync --extra desktop-qt          # Option B — PySide6 + QWebEngineView
desktop-webview = ["pywebview>=5.0"]
desktop-qt = ["PySide6>=6.7"]
# Build a Windows .exe (run on Windows): uv sync --extra build
build = ["pyinstaller>=6.0"]

[project.scripts]
raven-desktop = "raven.desktop.pywebview_app:main"
raven-desktop-qt = "raven.desktop.qt_app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["raven", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
pretty = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "ipython",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.8.0",
    "mypy>=1.13",
]
