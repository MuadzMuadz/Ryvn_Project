[project]
name = "raven"
version = "0.1.0"
description = "Personal AI assistant with local RAG and Firecrawl integration"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.5",
    "docx2txt>=0.9",
    "fastapi>=0.135.3",
    "firecrawl-py>=4.21.0",
    "langchain>=1.2.14",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.12",
    "langgraph>=1.1.4",
    "pypdf>=6.9.2",
    "python-dotenv>=1.2.2",
    "rich>=14.3.3",
    "sentence-transformers>=5.3.0",
    "sse-starlette>=3.3.4",
    "tiktoken>=0.12.0",
    "uvicorn>=0.42.0",
    "watchdog>=6.0.0",
]

[project.scripts]
raven = "raven.main:chat"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ipython"]
